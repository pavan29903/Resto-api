# Keeps a free-tier backend awake.
#
# Render's free plan spins a service down after 15 minutes of inactivity, and
# the next request then waits 30-60 seconds. That's fine for an API nobody is
# using, but a diner scanning a QR code at a table will give up long before it
# answers — so we poke it every 10 minutes.
#
# Delete this workflow if you move to a paid plan or to Fly.io, where the
# machine stays warm on its own.
#
# NOTE: GitHub's scheduled runs are best-effort and can be delayed by 5-15
# minutes under load, so this reduces cold starts rather than eliminating them.
# For a guaranteed interval use an external pinger such as cron-job.org.

name: Keep the API warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          # Set this under Settings -> Secrets and variables -> Actions -> Variables
          # e.g. https://restofood-api.onrender.com
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "API_URL variable is not set — nothing to ping."
            exit 0
          fi
          # A cold start can take a minute, so allow for it rather than
          # reporting a false failure.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/health" || echo "000")
          echo "$API_URL/health -> $code"
          [ "$code" = "200" ]

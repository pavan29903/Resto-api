[project]
name = "resto-api"
version = "0.1.0"
description = "RestoFood backend — Phase 0 pipeline: menu photo -> structured menu -> AI dish images -> static site + QR"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "qrcode[pil]>=7.4",
    "pillow>=10.3",
    "python-slugify>=8.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    "psycopg2-binary>=2.9",
    "pyjwt[crypto]>=2.9",
]

# Optional providers. Install only what you use:
#   uv sync --extra fal        # real AI dish images via fal.ai (FLUX)
#   uv sync --extra gemini     # menu extraction via Gemini instead of Claude
#   uv sync --extra replicate  # AI dish images via Replicate
[project.optional-dependencies]
fal = ["fal-client>=0.5"]
gemini = ["google-genai>=0.3"]
openai = ["openai>=1.50"]
replicate = ["replicate>=0.34"]

# Phase 0 is an application (a runnable pipeline), not a library to build/publish.
# Tell uv to manage the environment without trying to build/install this project.
[tool.uv]
package = false
